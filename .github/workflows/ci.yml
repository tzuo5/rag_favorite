name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[mcp,ingestion]" "pytest>=8,<10"
      - name: Test product core
        run: PYTHONPATH=src python -m pytest -q tests services/rag-app/tests

  quality:
    name: Quality and compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: python -m pip install -e ".[mcp,ingestion,dev]"
      - name: Lint
        run: make lint
      - name: Test ingestion
        run: make test-ingestion
      - name: Test compatibility services
        run: make test-compat
      - name: Test OpenClaw plugin
        run: make test-node
      - name: Compile
        run: make compile

  package:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: python -m pip install "build>=1.2,<2" "twine>=6,<7"
      - name: Build and inspect artifacts
        run: |
          python -m build
          python -m twine check dist/*
          python -m zipfile --list dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: rag-favorite-dist
          path: dist/
          if-no-files-found: error
