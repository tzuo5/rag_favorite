services:
  ollama:
    image: ollama/ollama:0.32.0
    container_name: ollama
    restart: unless-stopped

    ports:
      - "127.0.0.1:11434:11434"

    volumes:
      - ollama_models:/root/.ollama

    healthcheck:
      test:
        - CMD
        - ollama
        - list
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  ollama_models:
    name: ollama_models
